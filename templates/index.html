<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gym Card Scanner</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header id="app-header">
        <button id="btn-back" class="header-btn hidden" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>
        <h1 id="header-title">Gym Card Scanner</h1>
        <div class="header-spacer"></div>
    </header>

    <main id="app-main">
        <!-- Scanner View -->
        <section id="view-scanner" class="view active">
            <div id="camera-container">
                <video id="camera-feed" autoplay playsinline></video>
                <div id="scan-overlay">
                    <div class="scan-frame"></div>
                </div>
            </div>
            <div class="scanner-controls">
                <button id="btn-gallery" class="control-btn" aria-label="Gallery">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/>
                    </svg>
                </button>
                <button id="btn-capture" class="capture-btn" aria-label="Capture">
                    <div class="capture-inner"></div>
                </button>
                <button id="btn-switch-camera" class="control-btn" aria-label="Switch camera">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-5 11V9l4 3.5L15 16zm-1-4c0 2.76-2.24 5-5 5s-5-2.24-5-5 2.24-5 5-5 5 2.24 5 5z"/>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Crop View -->
        <section id="view-crop" class="view">
            <div id="crop-container">
                <canvas id="crop-canvas"></canvas>
                <div id="corner-handles">
                    <div class="corner-handle" data-corner="tl"></div>
                    <div class="corner-handle" data-corner="tr"></div>
                    <div class="corner-handle" data-corner="bl"></div>
                    <div class="corner-handle" data-corner="br"></div>
                </div>
                <svg id="crop-outline" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
            <div class="crop-controls">
                <button id="btn-retake" class="action-btn secondary">Retake</button>
                <button id="btn-crop-confirm" class="action-btn primary">Crop Card</button>
            </div>
        </section>

        <!-- Save View -->
        <section id="view-save" class="view">
            <div class="save-preview">
                <canvas id="result-canvas"></canvas>
            </div>
            <form id="save-form" class="save-form">
                <div class="form-group">
                    <label for="card-name">Member Name</label>
                    <input type="text" id="card-name" placeholder="Enter member name..." required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="card-notes">Notes (optional)</label>
                    <input type="text" id="card-notes" placeholder="e.g. Gold membership, Locker #42...">
                </div>
                <button type="submit" class="action-btn primary full-width">Save Card</button>
            </form>
        </section>

        <!-- Gallery View -->
        <section id="view-gallery" class="view">
            <div class="search-bar">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search by name..." autocomplete="off">
                <button id="btn-clear-search" class="clear-search hidden" aria-label="Clear search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <div id="gallery-grid" class="gallery-grid"></div>
            <div id="gallery-empty" class="gallery-empty hidden">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <p id="empty-message">No cards saved yet.<br>Scan your first card!</p>
            </div>
            <button id="btn-scan-new" class="fab" aria-label="Scan new card">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
            </button>
        </section>

        <!-- Card Detail View -->
        <section id="view-detail" class="view">
            <div class="detail-image">
                <canvas id="detail-canvas"></canvas>
            </div>
            <div class="detail-info">
                <h2 id="detail-name"></h2>
                <p id="detail-notes" class="detail-notes"></p>
                <p id="detail-date" class="detail-date"></p>
            </div>
            <div class="detail-actions">
                <button id="btn-delete-card" class="action-btn danger full-width">Delete Card</button>
            </div>
        </section>
    </main>

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
